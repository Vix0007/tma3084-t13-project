<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="280" viewBox="0 0 1220 280" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>TMA3084 course timeline</title>
  <defs>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="orangePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4EC"/>
      <stop offset="1" stop-color="#FFE6D6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0E2A47" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Group panels -->
  <rect x="8" y="8" width="686" height="262" rx="18" fill="url(#bluePanel)" stroke="#9CC3F5" stroke-width="1.5"/>
  <rect x="702" y="8" width="510" height="262" rx="18" fill="url(#orangePanel)" stroke="#F2A779" stroke-width="1.5"/>

  <!-- ===== Blue cards ===== -->
  <!-- 1 Proposal Submission (cx 101) -->
  <g>
    <rect x="24" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="101" cy="70" r="32" fill="#DCEAFF"/>
    <g transform="translate(101 70)" fill="#1E63D6">
      <path d="M-11 -15h14l9 9v21h-23z"/>
      <rect x="-6" y="-2" width="13" height="2.6" rx="1" fill="#FFFFFF"/>
      <rect x="-6" y="4" width="13" height="2.6" rx="1" fill="#FFFFFF"/>
    </g>
    <text x="101" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Proposal</text>
    <text x="101" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Submission</text>
    <rect x="34" y="152" width="134" height="28" rx="8" fill="#DCEAFF"/>
    <text x="101" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#0E2A47">Week 4</text>
    <rect x="34" y="216" width="134" height="30" rx="8" fill="#F1F6FD"/>
    <text x="101" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1726">9 Oct 2026</text>
  </g>

  <!-- 2 Proposal Presentation (cx 269) -->
  <g>
    <rect x="192" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="269" cy="70" r="32" fill="#D6F1F5"/>
    <g transform="translate(269 70)" fill="#0F8EA0">
      <rect x="-14" y="-15" width="28" height="18" rx="2"/>
      <polyline points="-9,-1 -3,-7 2,-3 9,-11" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-1.5" y="3" width="3" height="5"/>
      <path d="M-9 15l7-8h4l7 8" fill="none" stroke="#0F8EA0" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <text x="269" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Proposal</text>
    <text x="269" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Presentation</text>
    <rect x="202" y="152" width="134" height="28" rx="8" fill="#D6F1F5"/>
    <text x="269" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#0E2A47">Week 5</text>
    <rect x="202" y="216" width="134" height="30" rx="8" fill="#F1F6FD"/>
    <text x="269" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1726">19–23 Oct 2026</text>
  </g>

  <!-- 3 Initial Report (cx 437) -->
  <g>
    <rect x="360" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="437" cy="70" r="32" fill="#DCEAFF"/>
    <g transform="translate(437 70)" fill="#1E63D6">
      <path d="M-11 -15h14l9 9v21h-23z"/>
      <rect x="-6" y="2" width="3.4" height="8" fill="#FFFFFF"/>
      <rect x="-1" y="-3" width="3.4" height="13" fill="#FFFFFF"/>
      <rect x="4" y="-7" width="3.4" height="17" fill="#FFFFFF"/>
    </g>
    <text x="437" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Initial Report</text>
    <rect x="370" y="152" width="134" height="28" rx="8" fill="#DCEAFF"/>
    <text x="437" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#0E2A47">Week 9</text>
    <rect x="370" y="216" width="134" height="30" rx="8" fill="#F1F6FD"/>
    <text x="437" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1726">16 Nov 2026</text>
  </g>

  <!-- 4 Demo 1 (cx 605) -->
  <g>
    <rect x="528" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)" stroke="#1E63D6" stroke-width="2"/>
    <circle cx="605" cy="70" r="32" fill="#D6F1F5"/>
    <g transform="translate(605 70)">
      <rect x="-15" y="-13" width="30" height="20" rx="2.5" fill="#0F8EA0"/>
      <path d="M-3 -8v10l8-5z" fill="#FFFFFF"/>
      <rect x="-18" y="9" width="36" height="3.4" rx="1.7" fill="#0F8EA0"/>
    </g>
    <rect x="626" y="32" width="48" height="18" rx="9" fill="#1E63D6"/>
    <text x="650" y="45" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">NOW</text>
    <text x="605" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Demo 1</text>
    <rect x="538" y="152" width="134" height="28" rx="8" fill="#D6F1F5"/>
    <text x="605" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#0E2A47">Week 9</text>
    <rect x="538" y="216" width="134" height="30" rx="8" fill="#F1F6FD"/>
    <text x="605" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1726">16–20 Nov 2026</text>
  </g>

  <!-- ===== Orange cards ===== -->
  <!-- 5 Final Report (cx 789) -->
  <g>
    <rect x="712" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="789" cy="70" r="32" fill="#FDE3D6"/>
    <g transform="translate(789 70)">
      <path d="M-12 -15h14l9 9v21h-23z" fill="#E8622C"/>
      <rect x="-7" y="-3" width="12" height="2.6" rx="1" fill="#FFFFFF"/>
      <rect x="-7" y="3" width="8" height="2.6" rx="1" fill="#FFFFFF"/>
      <circle cx="8" cy="9" r="8" fill="#E8622C" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M4.5 9l2.5 2.6 4.5-5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="789" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Final Report</text>
    <rect x="722" y="152" width="134" height="28" rx="8" fill="#FDE3D6"/>
    <text x="789" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#5A2A12">Week 13</text>
    <rect x="722" y="216" width="134" height="30" rx="8" fill="#FFF5EF"/>
    <text x="789" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1726">24 Dec 2026</text>
  </g>

  <!-- 6 Final Demo 2 (cx 957) -->
  <g>
    <rect x="880" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="957" cy="70" r="32" fill="#FDE3D6"/>
    <g transform="translate(957 70)">
      <rect x="-15" y="-14" width="30" height="21" rx="2.5" fill="none" stroke="#E8622C" stroke-width="3"/>
      <path d="M-3 -8v10l8-5z" fill="#E8622C"/>
      <rect x="-9" y="11" width="18" height="3" rx="1.5" fill="#E8622C"/>
    </g>
    <text x="957" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">Final Demo 2</text>
    <rect x="890" y="152" width="134" height="28" rx="8" fill="#FDE3D6"/>
    <text x="957" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#5A2A12">Week 14</text>
    <rect x="890" y="216" width="134" height="30" rx="8" fill="#FFF5EF"/>
    <text x="957" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#0E1726">28–31 Dec 2026</text>
  </g>

  <!-- 7 e-Archive (cx 1125) -->
  <g>
    <rect x="1048" y="24" width="154" height="232" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="1125" cy="70" r="32" fill="#FDEBD3"/>
    <g transform="translate(1125 70)" fill="#EE8A1C">
      <rect x="-15" y="-13" width="30" height="7" rx="1.5"/>
      <rect x="-13" y="-4" width="26" height="17" rx="1.5"/>
      <rect x="-5" y="0" width="10" height="2.8" rx="1.4" fill="#FFFFFF"/>
    </g>
    <text x="1125" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#0E1726">e-Archive</text>
    <rect x="1058" y="152" width="134" height="28" rx="8" fill="#FDEBD3"/>
    <text x="1125" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#5A2A12">Week 15</text>
    <rect x="1058" y="216" width="134" height="30" rx="8" fill="#FFF5EF"/>
    <text x="1125" y="236" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0E1726">Before 10 Jan 2027</text>
  </g>

  <!-- Timeline line + dots -->
  <line x1="101" y1="198" x2="605" y2="198" stroke="#1E63D6" stroke-width="3"/>
  <line x1="605" y1="198" x2="789" y2="198" stroke="#9CC3F5" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="789" y1="198" x2="1125" y2="198" stroke="#E8622C" stroke-width="3"/>
  <g stroke-width="3" fill="#FFFFFF">
    <circle cx="101" cy="198" r="9" stroke="#1E63D6"/>
    <circle cx="269" cy="198" r="9" stroke="#0F8EA0"/>
    <circle cx="437" cy="198" r="9" stroke="#1E63D6"/>
    <circle cx="605" cy="198" r="9" stroke="#0F8EA0"/>
    <circle cx="789" cy="198" r="9" stroke="#E8622C"/>
    <circle cx="957" cy="198" r="9" stroke="#E8622C"/>
    <circle cx="1125" cy="198" r="9" stroke="#EE8A1C"/>
  </g>
  <g>
    <circle cx="101" cy="198" r="4" fill="#1E63D6"/>
    <circle cx="269" cy="198" r="4" fill="#0F8EA0"/>
    <circle cx="437" cy="198" r="4" fill="#1E63D6"/>
    <circle cx="605" cy="198" r="4" fill="#0F8EA0"/>
    <circle cx="789" cy="198" r="4" fill="#E8622C"/>
    <circle cx="957" cy="198" r="4" fill="#E8622C"/>
    <circle cx="1125" cy="198" r="4" fill="#EE8A1C"/>
  </g>
</svg>
